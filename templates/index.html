<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Intelligence Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="top">
    <h1>Campus Intelligence Hub</h1>
    <p>Check your placement chances, then ask about the rules.</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="pred-title">
      <h2 id="pred-title">Placement predictor</h2>
      <form id="predict-form" novalidate>
        <div class="grid">
          <label>CGPA <span class="hint">0 to 10</span>
            <input name="cgpa" type="number" step="0.01" min="0" max="10" value="7.8" required></label>
          <label>Coding score <span class="hint">0 to 100</span>
            <input name="coding_score" type="number" step="1" min="0" max="100" value="70" required></label>
          <label>Aptitude score <span class="hint">0 to 100</span>
            <input name="aptitude_score" type="number" step="1" min="0" max="100" value="65" required></label>
          <label>Communication <span class="hint">1 to 5</span>
            <input name="communication" type="number" step="1" min="1" max="5" value="4" required></label>
          <label>Projects
            <input name="projects" type="number" step="1" min="0" value="2" required></label>
          <label>Internships
            <input name="internships" type="number" step="1" min="0" value="1" required></label>
          <label>Active backlogs
            <input name="backlogs" type="number" step="1" min="0" value="0" required></label>
        </div>
        <button type="submit" id="predict-btn">Check eligibility</button>
      </form>

      <div id="result" class="result" hidden aria-live="polite">
        <div class="meter" role="img" aria-label="Placement probability">
          <div id="meter-fill" class="meter-fill"></div>
        </div>
        <p id="result-status" class="result-status"></p>
        <p id="result-prob" class="result-prob"></p>
        <p id="result-tier" class="result-tier"></p>
      </div>
      <p id="predict-error" class="error" hidden role="alert"></p>
    </section>

    <aside class="panel chat" aria-labelledby="chat-title">
      <h2 id="chat-title">Placement policy co-pilot</h2>
      <div id="chat-log" class="chat-log" aria-live="polite">
        <div class="msg bot">Ask me about drive rules, eligibility, tiers or recruiters.</div>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="e.g. How many backlogs are allowed?" autocomplete="off" aria-label="Your question">
        <button type="submit">Send</button>
      </form>
    </aside>
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
